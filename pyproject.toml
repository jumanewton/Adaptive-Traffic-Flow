[project]
name = "adaptive-traffic-flow-lab"
version = "0.1.0"
description = "Adaptive Traffic Flow Lab - Computer vision, simulation, and adaptive signal control for urban traffic"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Traffic Lab Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Observability
    "structlog>=24.1",
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp>=1.21",
    "prometheus-client>=0.19",
    # Utilities
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]
vision = [
    "ultralytics>=8.2",
    "torch>=2.3",
    "torchvision>=0.18",
    "filterpy>=1.4",  # For Kalman filter in ByteTrack
]
tracking = [
    "filterpy>=1.4",
]
simulation = [
    "sumolib>=1.19",
    "traci>=1.19",
]
streaming = [
    "aiokafka>=0.10",
    "kafka-python-ng>=2.2",
]
storage = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "clickhouse-connect>=0.8",
    "minio>=7.2",
]
ml = [
    "mlflow>=2.14",
    "tensorboard>=2.16",
]
all = [
    "ultralytics>=8.2",
    "torch>=2.3",
    "torchvision>=0.18",
    "filterpy>=1.4",
    "sumolib>=1.19",
    "traci>=1.19",
    "aiokafka>=0.10",
    "kafka-python-ng>=2.2",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "clickhouse-connect>=0.8",
    "minio>=7.2",
    "mlflow>=2.14",
    "tensorboard>=2.16",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps", "configs"]
include = ["traffic_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EXE", "FA", "ISC", "ICN", "PIE", "PT", "Q", "RET", "RUF", "SIM", "TCH", "TID", "TRY", "UP"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ARG001", "ARG002"]
per-file-ignores = { "tests/**/*" = ["S101", "S106"], "scripts/**/*" = ["S101", "S106", "T201"] }
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "*.egg-info", ".mypy_cache", ".pytest_cache", ".ruff_cache", "data", "models", "notebooks", "infra"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages", "apps", "configs"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "requires_gpu: Tests requiring GPU",
    "requires_sumo: Tests requiring SUMO",
    "requires_kafka: Tests requiring Kafka",
]

[tool.coverage.run]
source = ["packages", "apps", "configs"]
omit = ["*/tests/*", "*/conftest.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pre-commit-hooks]
# Configured in .pre-commit-config.yaml