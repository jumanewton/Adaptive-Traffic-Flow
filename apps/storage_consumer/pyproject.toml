[project]
name = "traffic-storage-consumer"
version = "0.1.0"
description = "Kafka consumer for persisting traffic events to TimescaleDB and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traffic-domain",
    "traffic-config",
    "traffic-observability",
    "traffic-streaming",
    "traffic-storage",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_storage_consumer*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true