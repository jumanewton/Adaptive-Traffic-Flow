[project]
name = "traffic-state-service"
version = "0.1.0"
description = "Traffic state estimation service - aggregates tracks into traffic state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traffic-domain",
    "traffic-config",
    "traffic-observability",
    "traffic-tracking",
    "traffic-vision",
    "traffic-traffic",
    "traffic-streaming",
    "traffic-simulation",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_state_service*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true