apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: traffic_lab
    user: traffic
    secureJsonData:
      password: traffic
    jsonData:
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    database: traffic_lab
    user: traffic
    secureJsonData:
      password: traffic
    jsonData:
      defaultDatabase: traffic_lab

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogs:
        datasourceUid: 'prometheus'
        tags: ['job', 'instance', 'pod', 'namespace']
        spanStartTimeShift: '1h'
        spanEndTimeShift: '-1h'
        filterByTraceID: true
        filterBySpanID: true