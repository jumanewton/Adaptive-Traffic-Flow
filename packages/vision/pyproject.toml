[project]
name = "traffic-vision"
version = "0.1.0"
description = "YOLO detection, camera calibration, and coordinate transforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traffic-domain",
    "traffic-config",
    "traffic-observability",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "torch>=2.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_vision*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true