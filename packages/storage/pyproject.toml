[project]
name = "traffic-storage"
version = "0.1.0"
description = "Data storage adapters for databases and object storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traffic-domain",
    "traffic-config",
    "traffic-observability",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "clickhouse-connect>=0.8",
    "minio>=7.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_storage*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true