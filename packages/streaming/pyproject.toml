[project]
name = "traffic-streaming"
version = "0.1.0"
description = "Kafka-compatible event streaming for Adaptive Traffic Flow Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "traffic-domain",
    "traffic-config",
    "traffic-observability",
    "aiokafka>=0.10",
    "kafka-python-ng>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_streaming*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true